name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build the embedded dashboard
        working-directory: web
        run: npm run build

      - name: Vet
        run: go vet ./...

      - name: Type check the dashboard
        working-directory: web
        run: npm run check

      - name: Go tests
        run: go test ./...

      - name: Go race tests
        run: go test -race ./...

      - name: Frontend tests
        working-directory: web
        run: npm run test:run

      - name: Build the binary
        run: go build -o bin/traceboard ./cmd/traceboard

      - name: Integration tests
        run: go test -tags=integration ./tests/integration/...

      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Release
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the release binaries
        run: |
          CGO_ENABLED=0 go run github.com/goreleaser/goreleaser/v2@latest release --clean
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
