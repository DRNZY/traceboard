version: 2

project_name: traceboard

before:
  hooks:
    - go mod tidy

builds:
  - id: traceboard
    # The dashboard must be built before the binary embeds it.
    hooks:
      - pre: make web-build
    main: ./cmd/traceboard
    binary: traceboard
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X traceboard/internal/buildinfo.Version={{ .Version }}
      - -X traceboard/internal/buildinfo.Commit={{ .FullCommit }}
      - -X traceboard/internal/buildinfo.BuildDate={{ .Date }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
        goarm: '6'

archives:
  - id: traceboard
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - docs/*.md
      - LICENSE*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
